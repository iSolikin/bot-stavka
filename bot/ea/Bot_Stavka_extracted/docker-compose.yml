version: "3.9"

services:
  bot:
    build: .
    container_name: esports_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - bot_sessions:/app/sessions
    networks:
      - esports_net

  postgres:
    image: postgres:16-alpine
    container_name: esports_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-esports_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esports_net

  redis:
    image: redis:7-alpine
    container_name: esports_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - esports_net

volumes:
  postgres_data:
  redis_data:
  bot_sessions:

networks:
  esports_net:
    driver: bridge
