        </div>` : ''}
    `;
  } catch (e) {
    mc.innerHTML = `<div class="empty"><div class="ek">×</div><div class="et">Ошибка загрузки</div><div class="es">${escHtml(e.message)}</div></div>`;
  }
}

// ============ GLOBAL SEARCH ============
let gsTimer = null;
document.getElementById('global-search').addEventListener('input', (e) => {
  const v = e.target.value.trim();
  clearTimeout(gsTimer);
  if (!v) return;
  gsTimer = setTimeout(async () => {
    const data = await api(`/api/teams?search=${encodeURIComponent(v)}&limit=1`);
    if (data.length) openTeam(data[0].name, data[0].game);
  }, 600);
});

// ============ MODAL ============
function closeModal(e) {
  if (e && e.target !== document.getElementById('overlay') && !e.target.classList.contains('modal-close')) return;
  document.getElementById('overlay').classList.remove('open');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal({target: document.getElementById('overlay')});
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('global-search').focus();
  }
});

// ============ NEWS PAGE ============
const EVENT_ICONS = {
  injury: '🤕', absence: '🚫', roster_remove: '👋', roster_add: '✅',
  bootcamp: '🏕', form_peak: '🔥', form_poor: '😞', win_streak: '📈',
  loss_streak: '📉', disqualified: '⛔', other: '📌',
};
const EVENT_LABELS = {
  injury: 'Травма', absence: 'Отсутствие', roster_remove: 'Уход', roster_add: 'Новый игрок',
  bootcamp: 'Бутcamп', form_peak: 'Пик формы', form_poor: 'Спад', win_streak: 'Серия побед',
  loss_streak: 'Серия поражений', disqualified: 'Дисквалификация', other: 'Новость',
};

function eventImpactColor(impact) {
  if (impact <= -0.3) return 'var(--bad)';
  if (impact < 0)    return 'var(--warn)';
  if (impact >= 0.2) return 'var(--ok)';
  if (impact > 0)    return 'var(--midori)';
  return 'var(--ink-low)';
}

function eventCardHtml(ev) {
  const icon = EVENT_ICONS[ev.event_type] || '📌';
  const label = EVENT_LABELS[ev.event_type] || ev.event_type;
  const color = eventImpactColor(ev.impact);
  const impStr = (ev.impact > 0 ? '+' : '') + (ev.impact * 100).toFixed(0) + '%';
  const gameStr = ev.game === 'cs2' ? '⚔ CS2' : ev.game === 'dota2' ? '✦ D2' : '';
  return `
    <div class="card" style="border-left:3px solid ${color};padding:14px 16px;cursor:default">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="font-size:22px;flex-shrink:0;margin-top:2px">${icon}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">
            ${ev.team ? `<span style="font-weight:800;font-size:13px;color:var(--ink-hi)">${escHtml(ev.team)}</span>` : ''}
            ${ev.player ? `<span style="font-size:11px;color:var(--ai);background:var(--ai-glow);padding:2px 8px;border-radius:99px">👤 ${escHtml(ev.player)}</span>` : ''}
            <span style="font-size:11px;color:var(--ink-low);background:var(--bg-base);border:1px solid var(--line);padding:2px 7px;border-radius:6px">${label}</span>
            ${gameStr ? `<span style="font-size:10px;color:var(--ink-low)">${gameStr}</span>` : ''}
            <span style="font-family:var(--mono);font-size:12px;font-weight:800;color:${color};margin-left:auto">${impStr}</span>
          </div>
          <div style="font-size:13px;color:var(--ink);line-height:1.5">${escHtml(ev.summary || '')}</div>
          <div style="margin-top:6px;font-size:11px;color:var(--ink-low)">
            ${ev.channel ? `@${escHtml(ev.channel)} · ` : ''}
            ${ev.processed_by === 'gemini' ? '🤖 Gemini · ' : '🔑 keywords · '}
            ${fmtDT(ev.created_at)}
          </div>
        </div>
      </div>
    </div>`;
}

function msgCardHtml(msg) {
  const ch = msg.channel ? `@${escHtml(msg.channel)}` : '—';
  const gameLabel = msg.game === 'cs2' ? '<span style="color:var(--cs2);font-size:10px">CS2</span>' :
                    msg.game === 'dota2' ? '<span style="color:var(--dota);font-size:10px">D2</span>' : '';
  return `
    <div class="card" style="padding:12px 14px;cursor:default">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span style="font-size:12px;font-weight:700;color:var(--ai)">${ch}</span>
        <div style="display:flex;align-items:center;gap:8px">
          ${gameLabel}
          <span style="font-size:11px;color:var(--ink-low)">${fmtDT(msg.posted_at)}</span>
        </div>
      </div>
      <div style="font-size:13px;color:var(--ink);line-height:1.6;white-space:pre-wrap">${escHtml((msg.text||'').slice(0,300))}${msg.text && msg.text.length > 300 ? '…' : ''}</div>
      ${msg.teams ? `<div style="margin-top:6px;font-size:11px;color:var(--ink-low)">🏷 ${escHtml(msg.teams)}</div>` : ''}
    </div>`;
}

async function renderNews(c) {
  let gameFilter = 'all';
  let hoursFilter = 24;

  async function doRender() {
    const gParam = gameFilter === 'all' ? '' : `&game=${gameFilter}`;
    const [events, messages] = await Promise.all([
      api(`/api/news/events?days=7${gParam}&limit=60`).catch(() => []),
      api(`/api/news/messages?hours=${hoursFilter}${gParam}&limit=60`).catch(() => []),
    ]);

    const highImpact = events.filter(e => Math.abs(e.impact) >= 0.3);
    const otherEvents = events.filter(e => Math.abs(e.impact) < 0.3);

    c.innerHTML = `
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center">
        <span style="font-size:12px;color:var(--ink-low);margin-right:4px">Игра:</span>
        ${['all','cs2','dota2'].map(g => `
          <button class="chip-btn${gameFilter===g?' active':''}" onclick="newsSetGame('${g}')">${g==='all'?'Все':g==='cs2'?'⚔ CS2':'✦ Dota2'}</button>
        `).join('')}
        <span style="font-size:12px;color:var(--ink-low);margin-left:12px;margin-right:4px">Период:</span>
        ${[6,24,48].map(h => `
          <button class="chip-btn${hoursFilter===h?' active':''}" onclick="newsSetHours(${h})">${h}ч</button>
        `).join('')}
      </div>

      ${highImpact.length ? `
        <div class="section-title" style="margin-bottom:12px">
          <h3>⚠️ Важные события</h3><span class="ks">警</span><span class="accent-line"></span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px">
          ${highImpact.map(eventCardHtml).join('')}
        </div>
      ` : ''}

      <div class="grid g-2-1" style="gap:20px">
        <div>
          <div class="section-title" style="margin-bottom:12px">
            <h3>📰 Все события</h3><span class="ks">事</span><span class="accent-line"></span>
          </div>
          ${otherEvents.length || highImpact.length ? `
            <div style="display:flex;flex-direction:column;gap:8px">
              ${otherEvents.map(eventCardHtml).join('')}
              ${!otherEvents.length && !highImpact.length ? '<div class="empty"><div class="ek">空</div><div class="et">Событий нет</div><div class="es">Подключи TG API и Gemini</div></div>' : ''}
            </div>
          ` : '<div class="empty"><div class="ek">空</div><div class="et">Событий нет</div><div class="es">Подключи Telegram API и Gemini Flash в .env</div></div>'}
        </div>

        <div>
          <div class="section-title" style="margin-bottom:12px">
            <h3>💬 Из каналов</h3><span class="ks">話</span><span class="accent-line"></span>
          </div>
          ${messages.length ? `
            <div style="display:flex;flex-direction:column;gap:8px">
              ${messages.slice(0,20).map(msgCardHtml).join('')}
            </div>
          ` : `<div class="empty"><div class="ek">空</div><div class="et">Сообщений нет</div><div class="es">Нужны TG_API_ID + TG_API_HASH в .env</div></div>`}
        </div>
      </div>
    `;
  }

  window.newsSetGame = (g) => { gameFilter = g; doRender(); };
  window.newsSetHours = (h) => { hoursFilter = h; doRender(); };
  await doRender();
}

// ============ CLOCK ============
function tick() {
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
}
tick(); setInterval(tick, 30000);

// ============ INIT ============
navigate('dashboard');
setInterval(() => { if (currentPage === 'dashboard' || currentPage === 'today') loadPage(currentPage); }, 5 * 60 * 1000);
</script>
